version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: spendcard_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Docker 내부 저장소
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql # PC 파일 직접 연결, postgres_data 볼륨이 비어있을 시, init.sql 자동 실행
    restart: unless-stopped # 의도적으로 끄지 않았으면 자동 재시작 (PC 재부팅 되어도 자동 실행)

volumes:
  postgres_data: